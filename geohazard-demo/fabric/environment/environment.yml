# Public libraries for the geohazard medallion notebooks.
#
# Published once as a Fabric Environment and attached to the notebooks, instead of
# per-run `%pip install`. Inline installation is disabled in many tenants (it raises
# MagicUsageError when a notebook runs from a pipeline), and an Environment is faster
# anyway because packages resolve once rather than on every session start.
#
# Fabric's environment API accepts .jar, .py, .whl, .tar.gz, or environment.yml -- a
# plain requirements.txt is rejected with EnvironmentValidationFailed.
#
# Most versions are left open so the Fabric runtime resolves a compatible set. `affine`
# is the exception and must stay pinned: with an unpinned resolve, silver fails at
# GeoBox construction with
#
#     TypeError: No '__dict__' attribute on 'Affine' instance to cache '_astuple' property
#
# because that release declares `_astuple` as a functools.cached_property on a class
# that defines __slots__, so there is nowhere to cache it. 2.3.1 predates that change
# and is the version rasterio and odc-geo are exercised against.
name: geohazard_env
dependencies:
  - pip
  - pip:
      # Pinned deliberately -- see the note above before changing.
      - affine==2.3.1
      # STAC access and on-demand COG extraction (silver)
      - pystac-client
      - planetary-computer
      - odc-stac
      - odc-geo
      - rioxarray
      - rasterio
      # Geometry, projections, clustering (silver + gold)
      - shapely
      - pyproj
      - scipy
      # Export and map artifacts (gold)
      - pyshp
      - folium
      # Data agent configuration (configure_data_agent notebook). The datasource
      # attachment REST API is undocumented preview; this SDK is the supported path.
      - fabric-data-agent-sdk
